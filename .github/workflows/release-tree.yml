name: Release Tree

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  check-changes:
      runs-on: ubuntu-latest
      outputs:
        has_tsv_changes: ${{ steps.changed-tsv-files.outputs.any_changed }}
      steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get all changed TSV files
        id: changed-tsv-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files: |
            trees/tsv/**.txt

  run-go-commands:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.has_tsv_changes == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.24.5'
    
    - name: Install dependencies
      working-directory: ./web/src/main/go
      run: go mod download
        
    - name: Build
      working-directory: ./web/src/main/go
      run: go build -o release-tree ./cmd/ben-new
    
    - name: Get all changed TSV files
      id: changed-tsv-files
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
      with:
        files: |
          trees/tsv/**.txt

    - name: Run Release Tree Script
      working-directory: ./web/src/main/go
      env:
        CHANGED_FILES: ${{ steps.changed-tsv-files.outputs.all_changed_files }}
      run: |
        ./release-tree $CHANGED_FILES

    - name: Upload Generated JSON Trees
      uses: actions/upload-artifact@v4
      with:
        name: generated-json-tree
        path: ./web/src/main/go/tree-output/