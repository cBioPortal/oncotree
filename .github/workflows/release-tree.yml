name: Release Tree

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  check-changes:
      runs-on: ubuntu-latest
      if: github.actor != 'github-actions[bot]'
      outputs:
        has_tsv_changes: ${{ steps.changed-tsv-files.outputs.any_changed }}
      steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get all changed TSV files
        id: changed-tsv-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files: |
            trees/tsv/**.txt

  run-go-commands:
    runs-on: ubuntu-latest
    needs: check-changes
    if: ${{ always() && needs.check-changes.outputs.has_tsv_changes == 'true' }}
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.24.5'
    
    - name: Install dependencies
      working-directory: ./web/src/main/go
      run: go mod download
        
    - name: Build tree release
      working-directory: ./web/src/main/go
      run: go build -o release-tree ./cmd/release-tree
    
    - name: Get all changed TSV files
      id: changed-tsv-files
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
      with:
        files: |
          trees/tsv/**.txt

    - name: Run Release Tree Script
      working-directory: ./web/src/main/go
      env:
        CHANGED_FILES: ${{ steps.changed-tsv-files.outputs.all_changed_files }}
      run: |
        ./release-tree $CHANGED_FILES

    - name: Commit and Push generated files to PR branch
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add ./trees/
        
        if ! git diff --cached --quiet; then
          git commit -m "chore: auto-generate tree artifacts"
          git push origin HEAD:${{ github.head_ref }}
        else
          echo "No changes detected in generated files. Skipping commit."
        fi
      
    - name: Build mapping validation
      working-directory: ./web/src/main/go
      run: go build -o validate-mappings ./cmd/validate-mappings

    - name: Validate mappings
      working-directory: ./web/src/main/go
      run: ./validate-mappings 

    - name: Build tree validation
      working-directory: ./web/src/main/go
      run: go build -o validate-trees ./cmd/validate-trees

    - name: Validate trees
      working-directory: ./web/src/main/go
      run: ./validate-trees